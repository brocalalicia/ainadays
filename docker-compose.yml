# Despliegue "todo en uno" (app + PostgreSQL). En Coolify: New resource → Docker Compose.
# Alternativa recomendada: crear la base de datos como recurso PostgreSQL de Coolify
# y desplegar solo la app con el Dockerfile (ver README).
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://ainadays:${POSTGRES_PASSWORD}@db:5432/ainadays
      APP_KEY: ${APP_KEY}
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ainadays
      POSTGRES_USER: ainadays
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ainadays -d ainadays"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
