  let sampleFn = null;
  const ai = { state: 'idle', text: '', error: '', ctl: null };
  async function askClaude() {
    if (!sampleFn || ai.state === 'loading') return;
    const today = dayOf(Date.now()), evs = allEvents();
    const ins = dayInsights(evs, today);
    const prompt = `Eres una asesora de lactancia y sueño infantil, cercana y concreta. Una madre da pecho en exclusiva a su hija Aïna, de 3 meses, y registra tomas, sueños y pañales en una app. Hoy es ${fmtDay(today)} y son las ${fmtTime(Date.now())}.

Registros desde ayer por la tarde (hora local; "(-1)" = ayer):
${daySummaryText(evs, today) || '(sin registros)'}

Cifras ya calculadas por la app (no las repitas, interprétalas):
${ins.rows.map(([k, v]) => `- ${k}: ${v.replace(/<[^>]+>/g, '')}`).join('\n')}

${L.aiLang}, en segunda persona, 3 o 4 párrafos cortos y sin títulos ni listas:
1. Qué dice la noche y el día de hoy sobre su ritmo (qué va bien y qué patrón se ve).
2. Una sola cosa concreta que cambiar o mantener hoy, con hora orientativa.
3. Qué esperar esta noche y cómo prepararla.
Referencias: a los 3 meses son normales 8–12 tomas/24 h, 14–17 h de sueño, ventanas de vigilia de 1–2 h, siestas de un ciclo (30–45 min) y 2–4 despertares nocturnos para mamar; con lactancia exclusiva pueden pasar varios días sin caca. No propongas dejarla llorar ni quitar tomas de noche. Sin alarmismos; si algo merece consulta con pediatra o matrona, dilo en una frase. Máximo 180 palabras.`;
    ai.state = 'loading'; ai.text = ''; ai.error = ''; ai.ctl = new AbortController();
    render();
    try {
      const { text } = await sampleFn(prompt, { signal: ai.ctl.signal, modelTier: 'default', onText: ({ text }) => { ai.text = text; render(); } });
      ai.text = text; ai.state = 'done';
    } catch (e) {
      ai.text = e && e.text ? e.text : ai.text; ai.state = 'done';
      const code = e && e.code;
      ai.error = code === 'cancelled' ? '' : code === 'not_granted' ? L.aiNotGranted : code === 'rate_limited' ? L.aiRate : L.aiFail;
      if (code === 'not_granted') sampleFn = null;
    }
    ai.ctl = null;
    render();
  }

      const isDur = draft.t === 'toma' || draft.t === 'sueno';

          ${draft.t === 'panal' ? `<div class="field"><label>${L.edDiaper}</label><div class="seg" data-f="p">
              <button aria-pressed="${draft.p === 'pipi'}" data-v="pipi">${L.pee}</button>
              <button aria-pressed="${draft.p === 'caca'}" data-v="caca">${L.poo}</button>
              <button aria-pressed="${draft.p === 'ambos'}" data-v="ambos">${L.side.A}</button></div></div>` : ''}
          <div class="field"><label>${isDur ? L.edStart : L.edTime}</label><input type="datetime-local" id="f-ini" value="${toLocalInput(draft.ini)}"></div>
          ${isDur ? `<div class="field"><label>${L.edEnd} <span style="font-weight:400">${L.edEndHint}</span></label><input type="datetime-local" id="f-fin" value="${draft.fin != null ? toLocalInput(draft.fin) : ''}"></div>` : ''}
          <div class="field"><label>${L.edNote}</label><input type="text" id="f-n" value="${esc(draft.n)}" placeholder="${L.edPlaceholder}"></div>
          <div class="btns"><button class="ghost" data-m="cancel">${L.cancel}</button><button class="primary" data-m="save">${L.save}</button></div>
          ${isNew ? '' : `<button class="del" data-m="delete">${L.del}</button>`}
        </div></div>`;
    };
    draw();
    let finTouched = false;
    modalRoot.addEventListener('input', e => {
      if (e.target.id === 'f-fin') finTouched = true;
      if (e.target.id === 'f-ini' && draft.t === 'toma' && !finTouched) {
        const ini = fromLocalInput(e.target.value), finEl = modalRoot.querySelector('#f-fin');
        if (ini && finEl) finEl.value = toLocalInput(ini + 10 * MIN);
      }
    });
    modalRoot.onclick = e => {
      const seg = e.target.closest('.seg button');
      if (seg) { const f = seg.closest('.seg').dataset.f; draft.ini = fromLocalInput(modalRoot.querySelector('#f-ini').value) ?? draft.ini; draft.n = modalRoot.querySelector('#f-n').value; draft[f] = seg.dataset.v; if (f === 't' && draft.t === 'toma' && draft.fin == null) draft.fin = draft.ini + 10 * MIN; draw(); return; }
      const m = e.target.closest('[data-m]');
      if (!m) { if (e.target.classList.contains('modal')) close(); return; }
      if (m.dataset.m === 'cancel') return close();
      if (m.dataset.m === 'delete') { deleteEvent(draft.id); return close(); }
      if (m.dataset.m === 'save') {
        const ini = fromLocalInput(modalRoot.querySelector('#f-ini').value);
        if (!ini) { toast(L.tMissingStart); return; }
        const finEl = modalRoot.querySelector('#f-fin');
        const fin = finEl ? fromLocalInput(finEl.value) : null;
        if (fin != null && fin < ini) { toast(L.tEndBefore); return; }
        const out = { id: draft.id, t: draft.t, ini, fin: (draft.t === 'toma' || draft.t === 'sueno') ? fin : null };
        if (draft.t === 'toma') out.lado = draft.lado;
        if (draft.t === 'panal') out.p = draft.p;
        const n = modalRoot.querySelector('#f-n').value.trim(); if (n) out.n = n;
        if (draft.t === 'nota' && !n) { toast(L.tWriteNote); return; }
        upsertEvent(out); close(); toast(L.tSaved);
      }
    };
    const close = () => { modalRoot.innerHTML = ''; modalRoot.onclick = null; };
  }

  let toastTimer;

  // ---------- Sincronización ----------
  // Tres modos, por orden: base de datos del artefacto (claude.use('db')),
  // API propia (/api, servidor Node + PostgreSQL) o solo este dispositivo.
  const syncEl = document.getElementById('sync');
  function setSync(state) { syncEl.dataset.state = state; syncEl.classList.toggle('on', state === 'on'); applyChrome(); }

  async function initDb() {
    let d = null;
    try { d = window.claude && window.claude.use ? await window.claude.use('db') : null; } catch { d = null; }
    if (!d) return initApi();
    db = d;
    const cutoff = shiftDay(dayId(Date.now()), -35);
    let first = true;
    db.collection('dias').where('fecha', '>=', cutoff).onSnapshot(snap => {
      const remote = {};
      snap.docs.forEach(doc => { if (doc.exists) remote[doc.id] = doc.data(); });
      if (first) {
        first = false;
        for (const id in days) if (!remote[id] && days[id].ev && days[id].ev.length) db.doc('dias/' + id).set(JSON.parse(JSON.stringify(days[id]))).catch(() => {});
      }
      mergeRemote(remote);
      setSync('on');
    }, err => {
      setSync('off');
      if (err && err.code === 'revoked') db = null;
    });
  }

  // --- API propia ---
  let api = false;
  const KEY_LS = 'ainadays.key';
  let apiKey = ''; try { apiKey = localStorage.getItem(KEY_LS) || ''; } catch {}
  const apiFetch = (path, opts = {}) => fetch(path, { ...opts, headers: { 'Content-Type': 'application/json', ...(apiKey ? { Authorization: 'Bearer ' + apiKey } : {}), ...(opts.headers || {}) } });

  function mergeRemote(remote) {
    const merged = { ...days };
    for (const id in remote) merged[id] = JSON.parse(JSON.stringify(remote[id]));
    days = merged;
    try { localStorage.setItem(LS_KEY, JSON.stringify(days)); } catch {}
    if (!modalRoot.firstChild) render(); else applyChrome();
  }

  async function pullApi(first = false) {
    if (!api) return;
    const cutoff = shiftDay(dayId(Date.now()), -35);
    let r;
    try { r = await apiFetch('/api/dias?desde=' + cutoff); } catch { setSync('off'); return; }
    if (r.status === 401) { setSync('off'); apiKey = ''; askKey(); return; }
    if (!r.ok) { setSync('off'); return; }
    const data = await r.json();
    const remote = {};
    for (const row of data.dias) remote[row.fecha] = row.doc;
    if (first) for (const id in days) if (!remote[id] && days[id].ev && days[id].ev.length) pushApi(id);
    mergeRemote(remote);
    setSync('on');
  }

  async function pushApi(id) {
    if (!api) return;
    try {
      const r = await apiFetch('/api/dias/' + id, { method: 'PUT', body: JSON.stringify(days[id]) });
      if (r.status === 401) { setSync('off'); askKey(); return; }
      if (!r.ok) throw new Error(r.status);
      const data = await r.json();
      if (data && data.doc) mergeRemote({ [id]: data.doc });
      setSync('on');
    } catch { setSync('off'); toast(L.tNoSync); }
  }

  let askingKey = false;
  function askKey() {
    if (askingKey || modalRoot.firstChild) return;
    askingKey = true;
    const fr = lang === 'fr';
    modalRoot.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-label="${fr ? 'Mot de passe' : 'Contraseña'}">
      <div class="sheet">
        <h3>${fr ? 'Mot de passe de l’application' : 'Contraseña de la aplicación'}</h3>
        <div class="field"><label>${fr ? 'Saisis-le une seule fois sur cet appareil' : 'Solo hay que escribirla una vez en este dispositivo'}</label>
          <input type="password" id="f-key" autocomplete="current-password" autofocus></div>
        <div class="btns"><button class="ghost" data-k="cancel">${L.cancel}</button><button class="primary" data-k="ok">${fr ? 'Entrer' : 'Entrar'}</button></div>
      </div></div>`;
    const done = v => {
      modalRoot.innerHTML = ''; modalRoot.onclick = null; askingKey = false;
      if (v == null) { render(); return; }
      apiKey = v.trim();
      try { localStorage.setItem(KEY_LS, apiKey); } catch {}
      pullApi(true);
    };
    modalRoot.onclick = e => {
      const b = e.target.closest('[data-k]');
      if (b) done(b.dataset.k === 'ok' ? modalRoot.querySelector('#f-key').value : null);
    };
    modalRoot.querySelector('#f-key').addEventListener('keydown', e => { if (e.key === 'Enter') done(e.target.value); });
    setTimeout(() => modalRoot.querySelector('#f-key')?.focus(), 50);
  }

  render();
  initDb();
  initSample();
  setInterval(() => { if (modalRoot.firstChild || ask.listening) return; const ta = document.getElementById('q-text'); if (ta) ask.text = ta.value; if (api) { pullApi(); pullMomentos(); } else if (tab !== 'guia') render(); }, 30000);
  document.addEventListener('visibilitychange', () => { if (document.hidden || modalRoot.firstChild) return; if (api) { pullApi(); pullMomentos(); } else render(); });
})();
</script>
</body>
</html>
