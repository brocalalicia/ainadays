<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17141F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<title>AïnaDays</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
  :root {
    --bg: #F3F0F6;
    --surface: #FFFFFF;
    --surface-2: #EAE6F0;
    --text: #2A2438;
    --muted: #6F6880;
    --line: #DCD7E4;
    --toma: #D48F1F;
    --toma-soft: #F8E7C5;
    --toma-ink: #7A4E05;
    --sueno: #5D63C4;
    --sueno-soft: #DEDFF6;
    --sueno-ink: #2F3480;
    --panal: #5F9A74;
    --panal-soft: #D9EBDF;
    --night: rgba(93, 99, 196, 0.09);
    --ok: #4C9A6A;
    --warn: #D48F1F;
    --bad: #C4554D;
    --shadow: 0 1px 2px rgba(42, 36, 56, 0.06), 0 6px 18px rgba(42, 36, 56, 0.07);
    --radius: 18px;
    --display: 'Fraunces', Georgia, 'Times New Roman', serif;
    --ui: 'Atkinson Hyperlegible', 'Helvetica Neue', Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17141F;
      --surface: #211C2B;
      --surface-2: #2B2537;
      --text: #EEE9F4;
      --muted: #A399B3;
      --line: #352E43;
      --toma: #E8AA45;
      --toma-soft: #3B2F16;
      --toma-ink: #F5D79A;
      --sueno: #8A8FE6;
      --sueno-soft: #262A4D;
      --sueno-ink: #C9CBF5;
      --panal: #7FBF95;
      --panal-soft: #1F3328;
      --night: rgba(138, 143, 230, 0.10);
      --ok: #6DBA8A;
      --warn: #E8AA45;
      --bad: #E07068;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 6px 18px rgba(0,0,0,0.25);
    }
  }
  :root[data-theme="dark"] {
    --bg: #17141F;
    --surface: #211C2B;
    --surface-2: #2B2537;
    --text: #EEE9F4;
    --muted: #A399B3;
    --line: #352E43;
    --toma: #E8AA45;
    --toma-soft: #3B2F16;
    --toma-ink: #F5D79A;
    --sueno: #8A8FE6;
    --sueno-soft: #262A4D;
    --sueno-ink: #C9CBF5;
    --panal: #7FBF95;
    --panal-soft: #1F3328;
    --night: rgba(138, 143, 230, 0.10);
    --ok: #6DBA8A;
    --warn: #E8AA45;
    --bad: #E07068;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 6px 18px rgba(0,0,0,0.25);
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--ui);
    font-size: 16px;
    line-height: 1.45;
    min-height: 100vh;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
    outline: 3px solid var(--sueno); outline-offset: 2px;
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

  .app { max-width: 480px; margin: 0 auto; padding: 16px 16px 96px; }

  header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  header.top h1 { font-family: var(--display); font-weight: 600; font-size: 26px; margin: 0; letter-spacing: -0.01em; }
  header.top .right { display: flex; align-items: center; gap: 10px; }
  .sync { font-size: 12px; white-space: nowrap; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
  .sync::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
  .sync.on::before { background: var(--ok); }
  .lang { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--surface); }
  .lang button { border: 0; background: none; padding: 5px 10px; font-size: 12.5px; font-weight: 700; color: var(--muted); }
  .lang button[aria-pressed="true"] { background: var(--sueno-soft); color: var(--sueno-ink); }

  .eyebrow { font-size: 11.5px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); }

  /* Status card */
  .status { background: var(--surface); border-radius: var(--radius); padding: 16px 18px; box-shadow: var(--shadow); display: grid; gap: 10px; }
  .status .big { font-family: var(--display); font-weight: 500; font-size: 34px; line-height: 1.1; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
  .status .big small { font-family: var(--ui); font-size: 15px; color: var(--muted); font-weight: 400; margin-left: 6px; }
  .status .hint { color: var(--muted); font-size: 14px; }
  .meter { height: 8px; border-radius: 4px; background: var(--surface-2); position: relative; overflow: hidden; }
  .meter .fill { position: absolute; inset: 0 auto 0 0; border-radius: 4px; background: var(--ok); transition: width .4s; }
  .meter .fill.warn { background: var(--warn); }
  .meter .fill.bad { background: var(--bad); }
  .meter-scale { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .last-row { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 10px; }
  .last-row b { color: var(--text); font-weight: 700; }

  /* Action buttons */
  .actions { display: grid; gap: 10px; margin-top: 14px; }
  .actions .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .actions .row.one { grid-template-columns: 1fr; }
  .btn-big { border: 0; border-radius: var(--radius); min-height: 84px; padding: 14px 16px; display: grid; align-content: center; justify-items: start; gap: 2px; text-align: left; box-shadow: var(--shadow); transition: transform .08s; }
  .btn-big:active { transform: scale(0.98); }
  .btn-big .lbl { font-size: 19px; font-weight: 700; }
  .btn-big .sub { font-size: 13px; opacity: 0.85; font-variant-numeric: tabular-nums; }
  .btn-big.toma { background: var(--toma-soft); color: var(--toma-ink); }
  .btn-big.toma.live { background: var(--toma); color: #1E1503; }
  .btn-big.sueno { background: var(--sueno-soft); color: var(--sueno-ink); }
  .btn-big.sueno.live { background: var(--sueno); color: #FFFFFF; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 9px 14px; font-size: 14px; font-weight: 700; }
  .chip.panal { color: var(--panal); border-color: var(--panal-soft); background: var(--panal-soft); }
  .chip.ai-btn { background: var(--sueno-soft); border-color: var(--sueno-soft); color: var(--sueno-ink); }

  /* InstAïna */
  .ig { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; margin-top: 14px; }
  .ig .ig-h { display: flex; justify-content: space-between; align-items: baseline; padding: 12px 16px 8px; }
  .ig .ig-h h2 { font-family: var(--display); font-weight: 600; font-size: 18px; margin: 0; }
  .ig .ig-h .eyebrow { font-family: var(--ui); }
  .ig img { display: block; width: 100%; max-height: 420px; object-fit: cover; background: var(--surface-2); cursor: pointer; }
  .ig .cap { padding: 10px 16px 12px; font-size: 15px; line-height: 1.45; }
  .ig .cap .d { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .ig .empty { margin: 0 16px 14px; }
  .album { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .album button { border: 0; padding: 0; background: var(--surface-2); border-radius: 10px; aspect-ratio: 1; overflow: hidden; position: relative; }
  .album img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .album .dd { position: absolute; left: 6px; bottom: 5px; font-size: 11px; font-weight: 700; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.7); }
  .sheet img.prev { width: 100%; max-height: 50vh; object-fit: contain; border-radius: 12px; background: var(--surface-2); }
  /* Consejo */
  .ask { background: var(--surface); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); margin-top: 14px; display: grid; gap: 10px; }
  .ask h2 { font-family: var(--display); font-weight: 600; font-size: 18px; margin: 0; }
  .ask textarea { font: inherit; font-size: 16px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); color: var(--text); width: 100%; min-height: 64px; resize: vertical; }
  .ask .row2 { display: flex; gap: 8px; align-items: center; }
  .ask .go { background: var(--sueno); color: #fff; border: 0; border-radius: 12px; padding: 11px 16px; font-weight: 700; }
  .ask .go:disabled { opacity: .6; }
  .mic { border: 1px solid var(--panal); background: var(--panal-soft); color: var(--panal); border-radius: 12px; padding: 10px 14px; font-weight: 700; display: inline-flex; align-items: center; gap: 7px; }
  .mic::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--panal); }
  .mic.on { background: var(--bad); border-color: var(--bad); color: #fff; }
  .mic.on::before { background: #fff; animation: pulse 1s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
  .chat { display: grid; gap: 8px; }
  .bub { max-width: 92%; padding: 9px 12px; border-radius: 14px; font-size: 15px; line-height: 1.5; display: grid; gap: 6px; }
  .bub p { margin: 0; }
  .bub.me { justify-self: end; background: var(--sueno-soft); color: var(--sueno-ink); border-bottom-right-radius: 4px; }
  .bub.ai { justify-self: start; background: var(--surface-2); border-bottom-left-radius: 4px; }
  .bub .src { font-size: 11.5px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
  .bub .src button { border: 0; background: none; color: var(--sueno); font-weight: 700; padding: 0; font-size: 11.5px; }
  .bub .trad { border-top: 1px solid var(--line); padding-top: 6px; color: var(--muted); display: grid; gap: 6px; }
  .ask .newc { border: 0; background: none; color: var(--muted); font-size: 12.5px; font-weight: 700; padding: 0; justify-self: end; }
  /* Sections */
  section.block { margin-top: 22px; }
  section.block h2 { font-family: var(--display); font-weight: 600; font-size: 19px; margin: 0 0 10px; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  section.block h2 .eyebrow { font-family: var(--ui); }

  /* Timeline */
  .tl { display: grid; gap: 3px; }
  .tl-bar { position: relative; height: 46px; border-radius: 8px; background: var(--surface-2); overflow: hidden; }
  .tl-bar.small { height: 30px; }
  .tl-bar.solo { height: 26px; }
  .tl-bar.solo .ev-sueno { top: 3px; bottom: 3px; height: auto; }
  .tl-bar.feeds { height: 14px; margin-top: 3px; }
  .tl-bar.feeds .ev-toma { top: 2px; bottom: 2px; width: 3px; }
  .tl-bar.feeds.solo-feeds { height: 22px; margin-top: 0; }
  .tl-bar.feeds.solo-feeds .ev-toma { top: 3px; bottom: 3px; }
  .tl-bar .night { position: absolute; top: 0; bottom: 0; background: var(--night); }
  .tl-bar .gl { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--c-grid); opacity: .7; }
  .tl-bar .gl.h6 { opacity: 1; }
  .tl-bar .ev-sueno { position: absolute; top: 0; height: 62%; background: var(--c-sueno); border-radius: 4px; min-width: 2px; }
  .tl-bar .ev-sueno.live { background: repeating-linear-gradient(90deg, var(--c-sueno) 0 6px, transparent 6px 9px); }
  .tl-bar .ev-toma { position: absolute; top: 3px; bottom: 3px; width: 3px; background: var(--c-toma); border-radius: 2px; box-shadow: 0 0 0 1px var(--surface); }
  .tl-bar .ev-panal { position: absolute; bottom: 3px; width: 8px; height: 8px; border-radius: 50%; background: var(--panal); box-shadow: 0 0 0 1.5px var(--surface); transform: translateX(-4px); }
  .tl-bar.small .ev-toma { top: 2px; bottom: 2px; width: 2.5px; }
  .tl-bar.small .ev-panal { width: 6px; height: 6px; bottom: 2px; transform: translateX(-3px); }
  .tl-bar .hit { position: absolute; top: 0; bottom: 0; width: 16px; transform: translateX(-8px); background: transparent; }
  .tl-bar .now { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--text); opacity: 0.55; }
  .tl-hours { position: relative; height: 13px; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .tl-hours span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
  .tl-hours span.first { transform: none; } .tl-hours span.last { transform: translateX(-100%); }
  .tl-legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
  .tl-legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  .tl-legend .l-sueno::before { background: var(--c-sueno); }
  .tl-legend .l-toma::before { background: var(--c-toma); }
  .tl-legend .l-panal::before { background: var(--panal); border-radius: 50%; }
  /* Stats */
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
  .stat { background: var(--surface); border-radius: 14px; padding: 10px 12px; box-shadow: var(--shadow); }
  .stat .v { font-family: var(--display); font-size: 22px; font-weight: 500; font-variant-numeric: tabular-nums; line-height: 1.15; }
  .stat .v small { font-family: var(--ui); font-size: 12px; color: var(--muted); }
  .stat .k { font-size: 12px; color: var(--muted); margin-top: 2px; }

  /* Event list */
  .list { display: grid; gap: 6px; }
  .item { width: 100%; border: 0; background: var(--surface); border-radius: 12px; padding: 10px 12px; text-align: left; display: grid; grid-template-columns: 52px 10px 1fr auto; align-items: center; gap: 10px; box-shadow: var(--shadow); }
  .item .t { font-variant-numeric: tabular-nums; font-weight: 700; }
  .item .dot { width: 10px; height: 10px; border-radius: 3px; }
  .item .dot.toma { background: var(--toma); }
  .item .dot.sueno { background: var(--sueno); }
  .item .dot.panal { background: var(--panal); border-radius: 50%; }
  .item .dot.nota { background: var(--muted); border-radius: 50%; }
  .item .d { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .item .live { color: var(--sueno); font-weight: 700; }
  .empty { color: var(--muted); font-size: 14px; background: var(--surface); border-radius: 12px; padding: 14px; }

  /* Week */
  .week { display: grid; gap: 8px; }
  .wrow { display: grid; grid-template-columns: 44px 1fr; gap: 8px; align-items: center; }
  .wrow .tl-hours { margin-top: 0; }
  .wrow .dl { font-size: 12px; color: var(--muted); line-height: 1.2; }
  .wrow .dl b { display: block; color: var(--text); font-size: 14px; }
  .wrow.today .dl b { color: var(--sueno); }
  .wstats { font-size: 11.5px; color: var(--muted); display: flex; gap: 10px; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .wstats b { color: var(--text); }
  .read { background: var(--surface); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); display: grid; gap: 8px; font-size: 14.5px; }
  .read .row { display: flex; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--line); padding-bottom: 8px; }
  .read .row:last-child { border-bottom: 0; padding-bottom: 0; }
  .read .row b { font-variant-numeric: tabular-nums; text-align: right; }
  .read .note { color: var(--muted); font-size: 13.5px; }

  /* Daily reading */
  .ins-h { margin: 14px 0 8px; }
  .kpi .ks { font-size: 11.5px; color: var(--muted); margin-top: 1px; }
  .kpi .d2 { display: grid; gap: 1px; margin-top: 5px; }
  .kpi .kd { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .kpi .kd.up { color: var(--ok); font-weight: 700; }
  .kpi .kd.down { color: var(--bad); font-weight: 700; }
  .ins-list { display: grid; gap: 8px; }
  .ins { background: var(--surface); border-radius: 14px; padding: 11px 14px; box-shadow: var(--shadow); display: grid; grid-template-columns: 78px 1fr; grid-template-rows: auto auto; column-gap: 12px; row-gap: 4px; font-size: 14.5px; line-height: 1.45; }
  .ins-k { grid-row: 1 / span 2; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--sueno); padding-top: 3px; }
  .ins-w { color: var(--text); }
  .ins-t { color: var(--muted); padding-left: 14px; position: relative; }
  .ins-t::before { content: "→"; position: absolute; left: 0; color: var(--sueno); }
  .next { margin-top: 10px; background: var(--sueno-soft); color: var(--sueno-ink); border-radius: 14px; padding: 12px 14px; display: grid; grid-template-columns: 78px 1fr; column-gap: 12px; font-size: 14.5px; line-height: 1.45; font-weight: 700; }
  .next .ins-k { grid-row: auto; color: var(--sueno-ink); }
  .ai { display: grid; gap: 10px; }
  .ai-text { font-size: 14.5px; line-height: 1.55; }
  .ai-text p { margin: 0 0 8px; }
  .ai-status { font-size: 13px; color: var(--muted); }


  /* Panel */
  :root { --c-toma: #D48F1F; --c-sueno: #5D63C4; --c-sueno-2: #A9ACE3; --c-grid: #E6E2EC; --c-ref: #B8B2C2; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --c-toma: #C4861E; --c-sueno: #7F84E0; --c-sueno-2: #4A4E8F; --c-grid: #2E2839; --c-ref: #5E5770; } }
  :root[data-theme="dark"] { --c-toma: #C4861E; --c-sueno: #7F84E0; --c-sueno-2: #4A4E8F; --c-grid: #2E2839; --c-ref: #5E5770; }
  .filters { display: flex; gap: 6px; margin: 0 0 12px; }
  .filters button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 13px; font-size: 13.5px; font-weight: 700; color: var(--muted); }
  .filters button[aria-pressed="true"] { background: var(--sueno-soft); border-color: var(--sueno); color: var(--sueno-ink); }
  .kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .kpi { background: var(--surface); border-radius: 14px; padding: 12px 14px; box-shadow: var(--shadow); }
  .kpi .l { font-size: 12.5px; color: var(--muted); }
  .kpi .v { font-size: 26px; font-weight: 700; line-height: 1.2; margin-top: 2px; }
  .kpi .v small { font-size: 13px; font-weight: 400; color: var(--muted); margin-left: 2px; }
  .kpi .d { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .kpi .d b { font-weight: 700; }
  .kpi .d.up b { color: var(--ok); } .kpi .d.down b { color: var(--bad); }
  .card { background: var(--surface); border-radius: var(--radius); padding: 14px 14px 10px; box-shadow: var(--shadow); margin-top: 12px; }
  .card h3 { margin: 0; font-size: 15px; font-weight: 700; }
  .card .sub { font-size: 12.5px; color: var(--muted); margin: 2px 0 8px; }
  .card .note { font-size: 13px; line-height: 1.45; color: var(--muted); margin-top: 8px; }
  .card svg { width: 100%; height: auto; display: block; overflow: visible; }
  .card svg text { font-family: var(--ui); font-size: 11px; fill: var(--muted); font-variant-numeric: tabular-nums; }
  .card svg .grid { stroke: var(--c-grid); stroke-width: 1; }
  .card svg .ref { stroke: var(--c-ref); stroke-width: 1; }
  .card svg .bar { rx: 0; }
  .card svg .hit { fill: transparent; }
  .card svg .pending { opacity: 0.45; }
  .card svg .hit:hover + .mark, .card svg .mark:hover { filter: brightness(1.12); }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin-top: 6px; }
  .legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; background: var(--sw); }
  .legend .line::before { height: 3px; border-radius: 2px; vertical-align: 3px; }
  .heat { display: grid; grid-template-columns: repeat(24, 1fr); gap: 2px; }
  .heat div { aspect-ratio: 1 / 1.4; border-radius: 3px; background: var(--surface-2); }
  .ptable { width: 100%; border-collapse: collapse; font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .ptable th, .ptable td { padding: 6px 4px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .ptable th { color: var(--muted); font-weight: 700; font-size: 11.5px; }
  .ptable th:first-child, .ptable td:first-child { text-align: left; }
  .ptable tr:last-child td { border-bottom: 0; }
  .tscroll { overflow-x: auto; }
  .tip { position: fixed; z-index: 30; pointer-events: none; background: var(--text); color: var(--bg); padding: 7px 10px; border-radius: 10px; font-size: 12.5px; line-height: 1.35; box-shadow: var(--shadow); max-width: 220px; }
  .tip b { font-size: 14px; }

  nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding: 6px 0 calc(6px + env(safe-area-inset-bottom)); }

  .seg { display: grid; grid-auto-flow: column; gap: 6px; }
  .seg button { border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 10px; font-weight: 700; }

  .sheet .del { background: none; border: 0; color: var(--bad); font-weight: 700; padding: 8px; justify-self: center; }

  .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: 90px; background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: 14px; font-weight: 700; z-index: 20; box-shadow: var(--shadow); }

    let prevEnd = wake;
    for (const n of naps) { if (prevEnd != null && n.ini > prevEnd) windows.push(n.ini - prevEnd); prevEnd = n.fin; }
    if (windows.length) rows.push([L.rWindows, windows.map(fmtDur).join(' · ')]);

    const diapers = evs.filter(e => e.t === 'panal' && e.ini >= w0 && e.ini < w1);
    const poo = diapers.filter(e => e.p === 'caca' || e.p === 'ambos').length;
    if (diapers.length) rows.push([L.rDiapers, `${L.rWet(diapers.length)}${poo ? `, ${L.rPoo(poo)}` : ''}`]);
    const lastPoo = [...evs].reverse().find(e => e.t === 'panal' && (e.p === 'caca' || e.p === 'ambos'));
    const pooDays = lastPoo ? Math.floor((now - lastPoo.ini) / DAY) : null;
    if (pooDays != null && pooDays >= 1) rows.push([L.rLastPoo, L.daysAgo(pooDays)]);

    // Noche anterior
    const night = nightStats(evs, shiftDay(today, -1));
    if (night && (night.feeds || night.bedtime)) {
      const first = night.gaps[0] || 0;
      const rest = night.gaps.slice(1, -1);
      const avgRest = rest.length ? rest.reduce((a, b) => a + b, 0) / rest.length : null;
      let what = L.nightWhat(night.bedtime ? fmtTime(night.bedtime) : null, night.feeds, fmtDur(night.longest)), todo;
      if (night.feeds >= 2 && first >= 3 * H && avgRest && avgRest < 2.5 * H) { what += L.nightFrontWhat(fmtDur(avgRest)); todo = L.nightFrontTodo; }
      else if (night.longest >= 5 * H && night.feeds <= 2) { what += L.nightGreatWhat; todo = L.nightGreatTodo; }
      else if (night.longest < 3 * H) { what += L.nightShortWhat; todo = L.nightShortTodo; }
      else { what += L.nightNormalWhat; todo = L.nightNormalTodo; }
      notes.push({ k: L.kNight, what, todo });
    }
    // Ritmo de tomas de día
    if (wake && dayFeeds.length) {
      const span = now - wake, every = span / dayFeeds.length, ok = every <= 2.5 * H;
      const what = L.feedsWhat(dayFeeds.length, fmtDur(span), dayFeeds.length >= 2 ? fmtDur(every) : null, ok);
      let todo = ok ? L.feedsTodoOk : L.feedsTodoSpaced;
      if (lastFeed) { const next = lastFeed.ini + 2.5 * H; todo += napping ? L.feedsNextNap : next > now ? L.feedsNextAt(fmtTime(next)) : L.feedsNextNow; }
      else todo += '.';
      notes.push({ k: L.kFeeds, what, todo });
    }
    // Siestas
    if (napDone.length) {
      const lens = napDone.map(e => e.fin - e.ini);
      const allShort = lens.every(l => l < 45 * MIN), anyLong = lens.some(l => l >= 90 * MIN);
      if (allShort) notes.push({ k: L.kNaps, what: L.napsShortWhat(lens.map(fmtDur).join(', ')), todo: L.napsShortTodo });
      else if (anyLong) notes.push({ k: L.kNaps, what: L.napsLongWhat(fmtDur(Math.max(...lens))), todo: L.napsLongTodo });
      else notes.push({ k: L.kNaps, what: L.napsOkWhat(lens.map(fmtDur).join(', ')), todo: L.napsOkTodo });
    }
    // Ventanas de vigilia
    if (windows.length) {
      const mx = Math.max(...windows), mn = Math.min(...windows);
      if (mx > 2 * H) notes.push({ k: L.kWindows, what: L.winLongWhat(fmtDur(mx)), todo: L.winLongTodo });
      else if (mn < 50 * MIN && windows.length >= 2) notes.push({ k: L.kWindows, what: L.winShortWhat(fmtDur(mn), fmtDur(mx)), todo: L.winShortTodo });
      else notes.push({ k: L.kWindows, what: L.winOkWhat(fmtDur(mn), fmtDur(mx)), todo: L.winOkTodo });
    }
    // Pañales: hoy + análisis de los últimos 5 días
    {
      const D5 = 5, from5 = w0 - (D5 - 1) * DAY;
      const all5 = evs.filter(e => e.t === 'panal' && e.ini >= from5 && e.ini < w1);
      const poos5 = all5.filter(e => e.p === 'caca' || e.p === 'ambos');
      const daysWithData = new Set(evs.filter(e => e.ini >= from5 && e.ini < w1).map(e => dayOf(e.ini))).size;
      const fullDays = Math.max(1, daysWithData - 1); // el día de hoy está a medias
      // Pipís: solo de día (07–20 h), porque de noche se cambia poco o nada; por eso no cuentan
      const isDaytime = ms => { const h = new Date(ms).getHours(); return h >= 7 && h < 20; };
      const wetPerDay = fullDays ? all5.filter(e => e.ini < w0 && e.p !== 'caca' && isDaytime(e.ini)).length / fullDays : null;
      if (diapers.length || poos5.length || daysWithData >= 2) {
        const parts = [];
        const wetTodayDay = diapers.filter(e => e.p !== 'caca' && isDaytime(e.ini)).length;
        if (diapers.length) parts.push(L.diapWhat(wetTodayDay, wetTodayDay >= 4));
        const hist = [];
        hist.push(poos5.length ? `${L.stPoo(poos5.length, Math.min(D5, Math.max(1, daysWithData)))}${poos5.length >= 2 ? ' ' + L.stAvg((poos5.length / Math.max(1, daysWithData)).toFixed(1).replace('.', ',')) : ''}` : (pooDays != null ? L.stNone(pooDays) : L.stNone(Math.max(1, daysWithData))));
        if (lastPoo) hist.push(L.stLast(now - lastPoo.ini < DAY ? fmtTime(lastPoo.ini) : L.daysAgo(pooDays)));
        if (wetPerDay != null && daysWithData >= 2) hist.push(L.stWet(wetPerDay.toFixed(1).replace('.', ',')));
        parts.push(`${L.st5(D5)}: ${hist.join(' · ')}.`);
        // interpretación, de más a menos urgente
        const gap = lastPoo ? (now - lastPoo.ini) / DAY : (daysWithData >= 2 ? daysWithData : 0);
        let todo;
        if (poos5.some(e => e.col === 'otro')) todo = L.stOther;
        else if (wetPerDay != null && daysWithData >= 3 && wetPerDay < 3) todo = L.stLowWet;
        else if (poos5.some(e => e.c === 'dura')) todo = L.stHard;
        else if (poos5.filter(e => e.col === 'verde').length >= 2) todo = L.stGreen;
        else if (gap >= 7) todo = L.stVeryLongGap(Math.floor(gap));
        else if (gap >= 3) todo = L.stLongGap(Math.floor(gap));
        else todo = L.stOkFreq + (wetPerDay != null && daysWithData >= 3 && wetPerDay >= 4 ? ' ' + L.stWetOk : '');
        notes.push({ k: L.kDiapers, what: parts.join(' '), todo });
      }
    }
    // Siguiente paso
    let next = null;
    if (isNight(now)) next = { k: L.kNight2, what: napping ? L.nightNextSleeping : L.nightNextAwake };
    else if (wake) {
      const lastEnd = napDone.length ? napDone[napDone.length - 1].fin : wake;
      const target = Math.max(s + 19 * H, Math.min(s + 20.5 * H, lastEnd + 105 * MIN));
      if (napping) next = { k: L.kNow, what: L.nowNap };
      else if (now < target && now > s + 16 * H) next = { k: L.kTonight, what: L.tonightAt(fmtTime(target - 25 * MIN), fmtTime(target), fmtTime(target - 90 * MIN)) };
      else if (now >= target) next = { k: L.kTonight, what: L.lateEvening };
      else next = { k: L.kTonight, what: L.tonightGoal };
    }
    // --- KPIs: día (a esta hora) y noche pasada, con diferencia vs ayer y vs media de 7 días ---
    const elapsed = now - s;
    const hoyU = dayUntil(evs, today, elapsed);
    const ayerU = dayUntil(evs, shiftDay(today, -1), elapsed);
    const prev = [];
    for (let i = 1; i <= 7; i++) { const d = dayUntil(evs, shiftDay(today, -i), elapsed); if (d.has) prev.push(d); }
    const mean = f => prev.length ? prev.reduce((a, d) => a + f(d), 0) / prev.length : null;
    const nochePrev = [];
    for (let i = 1; i <= 8; i++) { const n = nightUntil(evs, shiftDay(today, -1 - i)); if (n.done) nochePrev.push(n); }
    const meanN = f => nochePrev.length ? nochePrev.reduce((a, n) => a + f(n), 0) / nochePrev.length : null;
    const noche = nightUntil(evs, shiftDay(today, -1)), nocheAyer = nochePrev[0] || null;
    const num = x => x == null ? '—' : (Math.round(x * 10) / 10).toString().replace('.', ',');
    const numH = x => num(x) + ' ' + L.h;
    const kpis = `<div class="eyebrow ins-h">${L.kpiSoFar(fmtTime(now))}</div><div class="kpis">
      ${kpi(L.kpiFeedsD, hoyU.tomasDia, ayerU.has ? ayerU.tomasDia : null, mean(d => d.tomasDia), num, true, L.kpiSubNow)}
      ${kpi(L.kpiNaps, hoyU.siestas, ayerU.has ? ayerU.siestas : null, mean(d => d.siestas), num, true, L.kpiNapsSub(num(hoyU.napH / H)))}
      ${kpi(L.kpiFeedsN, noche.done || noche.feeds ? noche.feeds : null, nocheAyer ? nocheAyer.feeds : null, meanN(n => n.feeds), num, false, noche.longest ? L.kpiStretchSub(fmtDur(noche.longest)) : L.kpiSubNight)}
      ${kpi(L.kpiSleepN, noche.done || noche.sleep ? noche.sleep / H : null, nocheAyer ? nocheAyer.sleep / H : null, meanN(n => n.sleep / H), numH, true, L.kpiSubNight)}
    </div>`;
    return { rows, notes, next, kpis };
  }

  // Resumen en texto plano para pedir una lectura a Claude
  function daySummaryText(evs, today) {
    const s = dayStart(today), from = winStart(today), to = from + DAY, now = Date.now();
    const Ln = e => e.t === 'toma' ? `${fmtTime(e.ini)} ${L.evFeed.toLowerCase()}${e.lado ? ' ' + L.side[e.lado] : ''}${e.fin ? ' ' + fmtDur(e.fin - e.ini) : ' (' + L.ongoing + ')'}`
      : e.t === 'sueno' ? `${fmtTime(e.ini)}–${e.fin ? fmtTime(e.fin) : '…'} ${L.evSleep.toLowerCase()} ${fmtDur((e.fin ?? now) - e.ini)}${e.fin ? '' : ' (' + L.ongoing + ')'}`
      : e.t === 'panal' ? `${fmtTime(e.ini)} ${L.evDiaper.toLowerCase()} ${e.p === 'caca' ? L.pooOnly : e.p === 'ambos' ? L.both : L.peeOnly}`
      : `${fmtTime(e.ini)} ${L.evNote.toLowerCase()}`;
    return evs.filter(e => e.ini >= from && e.ini < to).map(e => `${e.ini < s ? '(-1) ' : ''}${Ln(e)}${e.n ? ` — ${e.n}` : ''}`).join('\n');
  }

  // ---------- Render ----------
  const main = document.getElementById('main');
  function applyChrome() {
    document.documentElement.lang = lang;
    document.querySelectorAll('nav.tabs button').forEach(b => { b.textContent = L.tabs[b.dataset.tab]; });
    document.querySelectorAll('.lang button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
    const sy = document.getElementById('sync');
    sy.textContent = sy.dataset.state === 'on' ? L.syncOn : sy.dataset.state === 'off' ? L.syncOff : L.syncLocal;
  }
  function render() {
    applyChrome();
    if (tab === 'hoy') renderHoy();
    else if (tab === 'semana') renderSemana();
    else if (tab === 'panel') renderPanel();
    else renderGuia();
  }

  // Barra de 24 h desde `from`. Dos carriles (sueño arriba, tomas y pañales abajo),
  // líneas de referencia cada 3 h y etiquetas cada 6 h.
  function timelineHTML(evs, from, opts = {}) {
    const now = Date.now(), to = from + DAY, small = !!opts.small;
    const pct = ms => Math.max(0, Math.min(100, (ms - from) / DAY * 100));
    const hourAt = h => new Date(from + h * H).getHours();
    const desc = e => {
      const rango = e.t === 'panal' ? fmtTime(e.ini) : `${fmtTime(e.a)}–${e.fin == null ? '…' : fmtTime(e.b)}`;
      if (e.t === 'sueno') return `<b>${L.evSleep}</b><br>${rango} · ${fmtDur((e.fin ?? now) - e.ini)}`;
      if (e.t === 'toma') return `<b>${L.evFeed}${e.lado ? ' · ' + L.side[e.lado] : ''}</b><br>${fmtTime(e.ini)}${e.dur ? ' · ' + (e.dur === 'larga' ? L.durLong : L.durShort) : ''}`;
      return `<b>${L.evDiaper} · ${e.p === 'caca' ? L.pooOnly : e.p === 'ambos' ? L.both : L.peeOnly}</b><br>${rango}`;
    };
    let fondo = '';
    // noche: de 20:00 a 07:00, dibujada dentro de la ventana
    for (let h = 0; h < 24; h++) {
      const hh = hourAt(h);
      if (hh >= 20 || hh < 7) fondo += `<div class="night" style="left:${h / 24 * 100}%;width:${100 / 24}%"></div>`;
    }
    let grid = '';
    for (let h = 3; h < 24; h += 3) grid += `<div class="gl${h % 6 === 0 ? ' h6' : ''}" style="left:${h / 24 * 100}%"></div>`;
    const cl = clipToWindow(evs, from, to);
    const solo = opts.only;
    const sleeps = (solo && solo !== 'sueno' ? [] : cl.filter(e => e.t === 'sueno')).map(e => `<div class="ev-sueno${e.fin == null ? ' live' : ''}" style="left:${pct(e.a)}%;width:${Math.max(0.3, pct(e.b) - pct(e.a))}%" data-tip="${esc(desc(e))}"></div>`).join('');
    const tomas = (solo && solo !== 'toma' ? [] : cl.filter(e => e.t === 'toma')).map(e => `<div class="ev-toma" style="left:${pct(e.a)}%" data-tip="${esc(desc(e))}"></div><div class="hit" style="left:${pct(e.a)}%" data-tip="${esc(desc(e))}"></div>`).join('');
    const panales = (solo ? [] : cl.filter(e => e.t === 'panal')).map(e => `<div class="ev-panal" style="left:${pct(e.ini)}%" data-tip="${esc(desc(e))}"></div><div class="hit" style="left:${pct(e.ini)}%" data-tip="${esc(desc(e))}"></div>`).join('');
    const nowLine = now >= from && now < to ? `<div class="now" style="left:${pct(now)}%"></div>` : '';
    const bar = `<div class="tl-bar${small ? ' small' : ''}${opts.cls ? ' ' + opts.cls : ''}" role="img" aria-label="${L.tlLabel(fmtDay(dayOf(from + H)))}">
      ${fondo}${grid}
      ${sleeps}${tomas}${panales}
      ${nowLine}</div>`;
    return `<div class="tl">${bar}${opts.hours === false ? '' : axisHTML(from)}</div>`;
  }
  // Etiquetas de hora alineadas con la barra (cada 6 h)
  function axisHTML(from) {
    // etiquetas cada 6 h desde el inicio de la ventana: siempre alineadas y sin solaparse
    let out = '';
    for (let h = 0; h <= 24; h += 6) {
      const d = new Date(from + h * H);
      const txt = d.getMinutes() === 0 ? pad(d.getHours()) : fmtTime(d.getTime());
      out += `<span class="${h === 0 ? 'first' : h === 24 ? 'last' : ''}" style="left:${h / 24 * 100}%">${txt}</span>`;
    }
    return `<div class="tl-hours">${out}</div>`;
  }

  function renderHoy() {
    const now = Date.now(), evs = allEvents(), today = dayOf(now);
    const toma = activeOf('toma'), sueno = activeOf('sueno');
    const lastSleep = [...evs].reverse().find(e => e.t === 'sueno' && e.fin != null);
    const lastToma = [...evs].reverse().find(e => e.t === 'toma' && e.fin != null);

    let statusHTML;
    const night = isNight(now);
    if (sueno) {
      statusHTML = `<div class="eyebrow">${L.sleeping}</div>
        <div class="big">${fmtDur(now - sueno.ini)}<small>${L.since(fmtTime(sueno.ini))}</small></div>
        <div class="hint">${night ? L.nightSleepHint : now - sueno.ini < 40 * MIN ? L.hintShortNap : L.hintGoodNap}</div>`;
    } else if (lastSleep && night) {
      statusHTML = `<div class="eyebrow">${L.awake}</div>
        <div class="big">${fmtDur(now - lastSleep.fin)}<small>${L.since(fmtTime(lastSleep.fin))}</small></div>
        <div class="hint">${L.nightAwakeHint}</div>`;
    } else if (lastSleep) {
      const awake = now - lastSleep.fin, m = awake / MIN;
      const cls = m < WAKE_OK ? '' : m < WAKE_WARN ? 'warn' : 'bad';
      const hint = m < 45 ? L.hint45 : m < WAKE_OK ? L.hintOk : m < WAKE_WARN ? L.hintWarn : L.hintBad;
      statusHTML = `<div class="eyebrow">${L.awake}</div>
        <div class="big">${fmtDur(awake)}<small>${L.since(fmtTime(lastSleep.fin))}</small></div>
        <div class="meter" aria-hidden="true"><div class="fill ${cls}" style="width:${Math.min(100, m / WAKE_MAX * 100)}%"></div></div>
        <div class="meter-scale"><span>0</span><span>1 ${L.h}</span><span>2 ${L.h}</span></div>
        <div class="hint">${hint}</div>`;
    } else {
      statusHTML = `<div class="eyebrow">${L.today}</div><div class="big">${fmtTime(now)}</div><div class="hint">${L.hintEmpty}</div>`;
    }
    const nextSide = lastToma ? (lastToma.lado === 'I' ? 'D' : lastToma.lado === 'D' ? 'I' : null) : null;
    const lastRow = lastToma
      ? `<div class="last-row"><span>${L.lastFeed(fmtDur(now - lastToma.fin), fmtTime(lastToma.ini), L.sideShort[lastToma.lado] || '', fmtDur(lastToma.fin - lastToma.ini))}</span>${nextSide ? `<span>${L.nextSide(L.side[nextSide])}</span>` : ''}</div>`
      : '';

    const tomaBtns = `<div class="row"><button class="btn-big toma" data-act="quick-toma" data-lado="I"><span class="lbl">${L.feedL}</span><span class="sub">${nextSide === 'I' ? L.yourTurn : L.fHow}</span></button>
         <button class="btn-big toma" data-act="quick-toma" data-lado="D"><span class="lbl">${L.feedR}</span><span class="sub">${nextSide === 'D' ? L.yourTurn : L.fHow}</span></button></div>`;
    const suenoBtn = sueno
      ? `<div class="row one"><button class="btn-big sueno live" data-act="stop-sueno"><span class="lbl">${L.wokeUp}</span><span class="sub">${L.sleptSince(fmtTime(sueno.ini), fmtDur(now - sueno.ini))}</span></button></div>`
      : `<div class="row one"><button class="btn-big sueno" data-act="start-sueno"><span class="lbl">${L.fellAsleep}</span><span class="sub">${L.startCount}</span></button></div>`;

    const ins = dayInsights(evs, today);
    const aiBlock = sampleFn ? `<div class="ai">
        ${ai.text ? `<div class="ai-text"><p>${esc(ai.text).replace(/\n\n+/g, '</p><p>').replace(/\n/g, '<br>')}</p></div>` : ''}
        ${ai.state === 'loading' ? `<div class="ai-status">${ai.text ? L.aiWriting : L.aiThinking}</div>` : ''}
        ${ai.error ? `<div class="ai-status">${esc(ai.error)}</div>` : ''}
        <div class="chips">${ai.state === 'loading' ? `<button class="chip" data-act="ai-stop">${L.aiStop}</button>` : `<button class="chip ai-btn" data-act="ai">${ai.text ? L.aiAgain : L.aiAsk}</button>`}</div>
      </div>` : '';
    const insightsHTML = `<section class="block"><h2>${L.reading}</h2>
      ${ins.kpis || ''}
      ${ins.rows.length ? `<div class="eyebrow ins-h">${L.today}</div><div class="read">${ins.rows.map(([k, v]) => `<div class="row"><span>${k}</span><b>${v}</b></div>`).join('')}</div>` : ''}
      ${ins.notes.length ? `<div class="eyebrow ins-h">${L.means}</div><div class="ins-list">${ins.notes.map(n => `<div class="ins"><div class="ins-k">${n.k}</div><div class="ins-w">${n.what}</div><div class="ins-t">${n.todo}</div></div>`).join('')}</div>` : ''}
      ${ins.next ? `<div class="next"><div class="ins-k">${ins.next.k}</div><div>${ins.next.what}</div></div>` : ''}
      ${!ins.rows.length && !ins.notes.length ? `<div class="empty">${L.emptyReading}</div>` : ''}
      ${aiBlock ? `<div class="read" style="margin-top:10px">${aiBlock}</div>` : ''}
    </section>`;

    const w0 = winStart(today), w1 = w0 + DAY;
    const listEvs = evs.filter(e => e.ini >= w0 && e.ini < w1).reverse();
    const listHTML = listEvs.length ? `<div class="list">${listEvs.map(e => {
      const desc = e.t === 'toma' ? `${L.evFeed} · ${L.side[e.lado] || ''}${e.dur ? ' · ' + (e.dur === 'larga' ? L.durLong : L.durShort) : ''}`
        : e.t === 'sueno' ? L.evSleep
        : e.t === 'panal' ? `${L.evDiaper} · ${e.p === 'caca' ? L.pooOnly : e.p === 'ambos' ? L.both : L.peeOnly}${e.c ? ' · ' + L.cons[e.c] : ''}${e.col ? ' · ' + L.cols[e.col] : ''}`
        : L.evNote;
      const dur = e.fin == null && (e.t === 'toma' || e.t === 'sueno') ? `<span class="live">${L.ongoing}</span>`
        : e.t === 'toma' || e.t === 'sueno' ? `${e.aprox ? L.approx + ' ' : ''}${fmtDur(e.fin - e.ini)}` : '';
      return `<button class="item" data-edit="${e.id}"><span class="t">${fmtTime(e.ini)}</span><span class="dot ${e.t}"></span><span>${desc}${e.n ? ` <span class="d">· ${esc(e.n)}</span>` : ''}</span><span class="d">${dur}</span></button>`;
    }).join('')}</div>` : `<div class="empty">${L.emptyToday}</div>`;

    main.innerHTML = `
      <div class="status">${statusHTML}${lastRow}</div>
      <div class="actions">
        ${tomaBtns}${suenoBtn}
        <div class="chips">
          <button class="chip panal" data-act="panal" data-p="pipi">${L.pee}</button>
          <button class="chip panal" data-act="panal" data-p="caca">${L.poo}</button>
          <button class="chip" data-act="nota">${L.note}</button>
          <button class="chip" data-act="manual">${L.manual}</button>
          <button class="chip" data-act="voice-log">${L.vBtn}</button>
          ${api ? `<button class="chip" data-act="ig-add">${L.igBtn}</button>` : ''}
        </div>
      </div>
      ${api ? (() => {
        const last = momentos[0];
        return `<div class="ig"><div class="ig-h"><h2>${L.igTitle}</h2>${last ? `<span class="eyebrow">${fmtDay(dayId(new Date(last.ts).getTime()))} · ${fmtTime(new Date(last.ts).getTime())}</span>` : ''}</div>
          ${last ? `<img alt="" src="${imgUrl(last.id)}" data-act="ig-open" data-id="${last.id}"><div class="cap">${last.nota ? esc(last.nota) : ''}</div>` : `<div class="empty">${L.igEmpty}</div>`}</div>`;
      })() : ''}
      <div class="ask">
        <h2>${L.qTitle}</h2>
        ${ask.turns.length ? `<div class="chat">${ask.turns.map((m, i) => m.role === 'user'
          ? `<div class="bub me"><p>${esc(m.texto).replace(/\n/g, '<br>')}</p></div>`
          : (() => { const swap = m.trad && (m.lang || 'es') !== lang; const main = swap ? m.trad : m.texto, other = swap ? m.texto : m.trad;
            return `<div class="bub ai">${main.split(/\n\n+/).map(p => `<p>${esc(p).replace(/\n/g, '<br>')}</p>`).join('')}${other && m.open ? `<div class="trad">${other.split(/\n\n+/).map(p => `<p>${esc(p).replace(/\n/g, '<br>')}</p>`).join('')}</div>` : ''}<div class="src">${m.source === 'claude' ? L.qByClaude : L.qByRules} · ${m.time}<button data-act="ask-save" data-i="${i}">${L.qSaveNote}</button>${other ? `<button data-act="ask-trad" data-i="${i}">${m.open ? L.qHide : L.qShowFr}</button>` : ''}</div></div>`; })()).join('')}
          ${ask.state === 'loading' ? `<div class="bub ai"><p class="src">${L.qThinking}</p></div>` : ''}</div>` : ''}
        <textarea id="q-text" placeholder="${L.qPlaceholder}">${esc(ask.text)}</textarea>
        <div class="row2"><button class="go" data-act="ask" ${ask.state === 'loading' ? 'disabled' : ''}>${L.qAsk}</button>${SR ? `<button class="mic${ask.listening ? ' on' : ''}" data-act="mic">${ask.listening ? L.qMicStop : L.qMic}</button>` : ''}</div>
        ${ask.turns.length ? `<button class="newc" data-act="ask-new">${L.qNew}</button>` : ''}
      </div>
      <section class="block">
        <h2>${L.today} <span class="eyebrow">${fmtDay(today)} · ${fmtTime(w0)} → ${fmtTime(w0)}</span></h2>
        ${timelineHTML(evs, w0)}
        <div class="tl-legend" style="margin-top:6px"><span class="l-sueno">${L.legend.sueno}</span><span class="l-toma">${L.legend.toma}</span><span class="l-panal">${L.legend.panal}</span></div>
      </section>
      ${insightsHTML}
      <section class="block">
        <h2>${L.records} <span class="eyebrow">${L.tapToFix}</span></h2>
        ${listHTML}
      </section>`;
  }

  function renderSemana() {
    const now = Date.now(), evs = allEvents(), today = dayOf(now);
    // en modo noche, la fila del día D empieza a las 19:30 de la víspera y deja la noche entera dentro
    const desde = id => weekAxis === 'night' ? winStart(id) : dayStart(id);
    const ids = []; for (let i = 6; i >= 0; i--) ids.push(shiftDay(today, -i));
    // Una fila por día con una sola barra: 'sueno' o 'toma'
    const filaHTML = (id, tipo) => {
      const from = desde(id), to = from + DAY;
      const cl = clipToWindow(evs, from, to);
      const n = nightStats(evs, shiftDay(id, -1));   // la noche que acaba la mañana de D
      const d = new Date(dayStart(id));
      const bar = timelineHTML(evs, from, { hours: false, small: true, only: tipo, cls: tipo === 'sueno' ? 'solo' : 'feeds solo-feeds' });
      let stats;
      if (!cl.length) stats = `<span>${L.noRecords}</span>`;
      else if (tipo === 'sueno') {
        const sueno = cl.filter(e => e.t === 'sueno').reduce((a, e) => a + (e.b - e.a), 0);
        const nocturno = clipSum(evs, dayStart(id) - 5 * H, dayStart(id) + 8 * H, 'sueno');
        stats = `<span><b>${fmtHours(sueno)} ${L.h}</b> ${L.wSleep}</span>${n && n.finished ? `<span>${L.wNight} <b>${fmtHours(nocturno)} ${L.h}</b>, ${L.wMax} <b>${fmtDur(n.longest)}</b></span>` : ''}`;
      } else {
        const tomas = cl.filter(e => e.t === 'toma').length;
        stats = `<span><b>${tomas}</b> ${L.wFeeds}</span>${n && n.finished ? `<span>${L.wNight} <b>${n.feeds}</b> ${L.wFeeds}</span>` : ''}`;
      }
      return `<div class="wrow${id === today ? ' today' : ''}">
        <div class="dl"><b>${WDs(d)}</b>${d.getDate()} ${L.mo[d.getMonth()]}</div>
        <div>${bar}<div class="wstats">${stats}</div></div></div>`;
    };
    const rowsSueno = ids.map(id => filaHTML(id, 'sueno')).join('');
    const rowsTomas = ids.map(id => filaHTML(id, 'toma')).join('');
    const eje = `<div class="wrow"><div class="dl"></div><div>${axisHTML(desde(today))}</div></div>`;

    const withData = ids.filter(id => clipToDay(evs, id).length > 0 && id !== today);
    const nights = ids.map(id => nightStats(evs, shiftDay(id, -1))).filter(n => n && n.finished);
    const wakes = [], beds = [];
    for (const id of ids) {
      const s = dayStart(id);
      const w = morningWake(evs.filter(e => e.t === 'sueno'), s);
      if (w != null) wakes.push(minutesOfDay(w));
      const n = nightStats(evs, shiftDay(id, -1)); if (n && n.bedtime) beds.push(minutesOfDay(n.bedtime));
    }
    const avg = arr => arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : null;
    const avgTomas = avg(withData.map(id => dayStats(evs, id).tomas));
    const avgSueno = avg(withData.map(id => dayStats(evs, id).sueno));
    const avgNightFeeds = avg(nights.map(n => n.feeds));
    const avgLongest = avg(nights.map(n => n.longest));
    const medWake = median(wakes), medBed = median(beds);
    const spread = arr => arr.length > 1 ? Math.max(...arr) - Math.min(...arr) : 0;
    const dec = x => x.toFixed(1).replace('.', ',');

    let read = '';
    if (withData.length < 2 && nights.length < 2) {
      read = `<div class="read"><div class="note">${L.weekEmpty}</div></div>`;
    } else {
      const lines = [];
      if (medWake != null) lines.push(`<div class="row"><span>${L.wkWake}</span><b>${fmtMinutes(medWake)}${spread(wakes) > 60 ? ` <span class="note">${L.varies(fmtDur(spread(wakes) * MIN))}</span>` : ''}</b></div>`);
      if (medBed != null) lines.push(`<div class="row"><span>${L.wkBed}</span><b>${fmtMinutes(medBed)}${spread(beds) > 60 ? ` <span class="note">${L.varies(fmtDur(spread(beds) * MIN))}</span>` : ''}</b></div>`);
      if (avgTomas != null) lines.push(`<div class="row"><span>${L.wkFeeds}</span><b>${dec(avgTomas)}</b></div>`);
      if (avgSueno != null) lines.push(`<div class="row"><span>${L.wkSleep}</span><b>${fmtHours(avgSueno)} ${L.h}</b></div>`);
      if (avgNightFeeds != null) lines.push(`<div class="row"><span>${L.wkNightFeeds}</span><b>${dec(avgNightFeeds)}</b></div>`);
      if (avgLongest != null) lines.push(`<div class="row"><span>${L.wkLongest}</span><b>${fmtDur(avgLongest)}</b></div>`);
      const tips = [];
      if (medWake != null && spread(wakes) > 60) tips.push(L.tipWake);
      if (medBed != null && spread(beds) > 60) tips.push(L.tipBed);
      if (avgTomas != null && avgTomas < 7) tips.push(L.tipFeeds);
      if (avgSueno != null && avgSueno < 13 * H) tips.push(L.tipSleep);
      if (avgLongest != null && avgLongest >= 4 * H) tips.push(L.tipLong);
      if (tips.length) lines.push(`<div class="note">${tips.map(t => '• ' + t).join('<br>')}</div>`);
      read = `<div class="read">${lines.join('')}</div>`;
    }

    main.innerHTML = `
      <section class="block" style="margin-top:0">
        <h2>${L.wSleepTitle}</h2>
        <div class="filters"><button data-axis="night" aria-pressed="${weekAxis === 'night'}">${L.axisNight}</button><button data-axis="day" aria-pressed="${weekAxis === 'day'}">${L.axisDay}</button><span style="align-self:center;font-size:12.5px;color:var(--muted);margin-left:4px">${weekAxis === 'night' ? L.axisNightSub : L.axisDaySub}</span></div>
        <div class="week">${eje}${rowsSueno}${eje}</div>
        <div class="tl-legend" style="margin-top:8px"><span class="l-sueno">${L.legend.sueno}</span></div>
      </section>
      <section class="block">
        <h2>${L.wFeedsTitle}</h2>
        <div class="week">${eje}${rowsTomas}${eje}</div>
        <div class="tl-legend" style="margin-top:8px"><span class="l-toma">${L.legend.toma}</span></div>
      </section>
      <section class="block">
        <h2>${L.weekReading}</h2>
        ${read}
      </section>`;
  }


  // ---------- Panel de seguimiento ----------
  let weekAxis = 'night';
  try { weekAxis = localStorage.getItem('ainadays.axis') === 'day' ? 'day' : 'night'; } catch {}
  let panelRange = 14;
  try { panelRange = Number(localStorage.getItem('ainadays.range')) || 14; } catch {}
  const clipSum = (evs, a, b, t) => evs.filter(e => e.t === t).reduce((acc, e) => { const fin = e.fin ?? Date.now(); const x = Math.max(e.ini, a), y = Math.min(fin, b); return acc + (y > x ? y - x : 0); }, 0);

  // Una fila por día lógico D: la noche que acaba la mañana de D (19–08 h) + el día D (07–20 h)
  function panelRows(evs, ids) {
    const now = Date.now();
    return ids.map(id => {
      const s = dayStart(id);
      const feedsD = evs.filter(e => e.t === 'toma' && e.ini >= s + 7 * H && e.ini < s + 20 * H).length;
      const feedsN = evs.filter(e => e.t === 'toma' && e.ini >= s - 4 * H && e.ini < s + 7 * H).length;
      const naps = clipSum(evs, s + 8 * H, s + 19 * H, 'sueno');
      const napsN = evs.filter(e => e.t === 'sueno' && e.fin != null && e.ini >= s + 8 * H && e.ini < s + 19 * H).length;
      const nightSleep = clipSum(evs, s - 5 * H, s + 8 * H, 'sueno');
      const n = nightStats(evs, shiftDay(id, -1));
      const wake = morningWake(evs.filter(e => e.t === 'sueno'), s);
      const has = evs.some(e => e.ini >= s - WIN_OFF && e.ini < s - WIN_OFF + DAY);
      const hours = evs.filter(e => e.t === 'toma' && e.ini >= s - WIN_OFF && e.ini < s - WIN_OFF + DAY).map(e => new Date(e.ini).getHours());
      return { id, has, feedsD, feedsN, naps, napsN, nightSleep, longest: n && (n.bedtime || n.feeds) ? n.longest : null, nightDone: !!(n && n.finished && (n.bedtime || n.feeds)), bed: n && n.bedtime ? minutesOfDay(n.bedtime) : null, wake: wake != null ? minutesOfDay(wake) : null, hours, future: s - WIN_OFF > now };
    });
  }

  function renderPanel() {
    const evs = allEvents(), today = dayOf(Date.now());
    const ids = []; for (let i = panelRange - 1; i >= 0; i--) ids.push(shiftDay(today, -i));
    const rows = panelRows(evs, ids);
    const prevIds = []; for (let i = 2 * panelRange - 1; i >= panelRange; i--) prevIds.push(shiftDay(today, -i));
    const prev = panelRows(evs, prevIds).filter(r => r.has);
    const withData = rows.filter(r => r.has);
    const avg = (arr, f) => { const v = arr.map(f).filter(x => x != null); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; };
    const dec = x => x == null ? '—' : x.toFixed(1).replace('.', ',');

    // KPIs (media diaria del rango, con delta frente al periodo anterior)
    const kpi = (label, cur, before, fmt, unit, upGood) => {
      const delta = cur != null && before != null ? cur - before : null;
      const cls = delta == null || Math.abs(delta) < 1e-9 ? '' : (delta > 0) === upGood ? 'up' : 'down';
      return `<div class="kpi"><div class="l">${label}</div><div class="v">${cur == null ? '—' : fmt(cur)}<small>${unit}</small></div>${delta != null ? `<div class="d ${cls}"><b>${delta > 0 ? '+' : ''}${fmt(delta)}</b> ${L.pVsPrev}</div>` : ''}</div>`;
    };
    const fullDays = withData.filter(r => r.nightDone);
    const kpis = `<div class="kpis">
      ${kpi(L.kFeeds24, avg(fullDays, r => r.feedsD + r.feedsN), avg(prev.filter(r => r.nightDone), r => r.feedsD + r.feedsN), dec, '', true)}
      ${kpi(L.kSleep24, avg(fullDays, r => (r.naps + r.nightSleep) / H), avg(prev.filter(r => r.nightDone), r => (r.naps + r.nightSleep) / H), dec, ' ' + L.h, true)}
      ${kpi(L.kNightFeeds, avg(fullDays, r => r.feedsN), avg(prev.filter(r => r.nightDone), r => r.feedsN), dec, '', false)}
      ${kpi(L.kLongest, avg(fullDays, r => r.longest / H), avg(prev.filter(r => r.nightDone), r => r.longest / H), dec, ' ' + L.h, true)}
    </div>`;

    const withDataAll = rows.filter(r => r.has);
    // Geometría común
    const W = 400, PL = 26, PR = 8, PT = 8, PB = 20, IH = 120, PH = PT + IH + PB;
    const n = rows.length, slot = (W - PL - PR) / n, bw = Math.min(24, slot * 0.62);
    const x = i => PL + slot * i + (slot - bw) / 2;
    const labelEvery = n > 16 ? 4 : n > 8 ? 2 : 1;
    const xLabels = rows.map((r, i) => i % labelEvery === 0 || i === n - 1 ? `<text x="${PL + slot * i + slot / 2}" y="${PH - 5}" text-anchor="middle">${new Date(dayStart(r.id)).getDate()}</text>` : '').join('');
    const yTicks = (max, step, unit = '') => { let out = ''; for (let v = 0; v <= max + 1e-9; v += step) { const y = PT + IH - v / max * IH; out += `<line class="grid" x1="${PL}" x2="${W - PR}" y1="${y}" y2="${y}"></line><text x="${PL - 5}" y="${y + 3.5}" text-anchor="end">${v}${unit}</text>`; } return out; };
    const dayName = id => fmtDay(id);
    const tipAttr = txt => `data-tip="${esc(txt)}"`;
    const col = (i, y0, h, fill, tip, cls = '') => h <= 0 ? '' : `<rect class="mark ${cls}" x="${x(i)}" y="${y0 - h}" width="${bw}" height="${h}" fill="${fill}" ${tipAttr(tip)}></rect>`;

    // 1. Tramo nocturno más largo
    const longMax = Math.max(6, ...rows.map(r => r.longest != null ? r.longest / H : 0));
    const lmax = Math.ceil(longMax / 2) * 2;
    const y1 = v => PT + IH - v / lmax * IH;
    let c1 = yTicks(lmax, 2, '');
    c1 += `<line class="ref" x1="${PL}" x2="${W - PR}" y1="${y1(4)}" y2="${y1(4)}"></line>`;
    rows.forEach((r, i) => { if (r.longest == null) return; const v = r.longest / H; const tip = `<b>${fmtDur(r.longest)}</b><br>${L.night} ${dayName(r.id)}${r.nightDone ? '' : ' · ' + L.pending}`; c1 += `<rect class="hit" x="${PL + slot * i}" y="${PT}" width="${slot}" height="${IH}" ${tipAttr(tip)}></rect>` + col(i, y1(0), IH - (y1(v) - PT), 'var(--c-sueno)', tip, r.nightDone ? '' : 'pending'); });
    // número encima de cada barra (formato corto si hay poco sitio)
    const corto = ms => { const m = Math.round(ms / MIN); return slot >= 34 ? `${Math.floor(m / 60)}h${pad(m % 60)}` : (m / 60).toFixed(1).replace('.', ','); };
    if (slot >= 20) rows.forEach((r, i) => { if (r.longest == null) return;
      c1 += `<text x="${x(i) + bw / 2}" y="${y1(r.longest / H) - 4}" text-anchor="middle" style="font-size:${slot >= 34 ? 10 : 9}px;fill:var(--text);font-weight:700${r.nightDone ? '' : ';opacity:.45'}">${corto(r.longest)}</text>`; });

    // 2. Tomas día / noche (apiladas)
    const fmax = Math.max(4, ...rows.map(r => r.feedsD + r.feedsN));
    const fm = Math.ceil(fmax / 2) * 2;
    const y2 = v => PT + IH - v / fm * IH;
    let c2 = yTicks(fm, fm > 8 ? 4 : 2);
    rows.forEach((r, i) => { if (!r.has) return; const t0 = r.feedsD + r.feedsN, pD = t0 ? Math.round(r.feedsD / t0 * 100) : 0; const tip = `<b>${t0} ${L.tipFeeds}</b><br>${dayName(r.id)}<br>${L.sDay}: ${r.feedsD} (${pD} %) · ${L.sNight}: ${r.feedsN} (${100 - pD} %)`;
      c2 += `<rect class="hit" x="${PL + slot * i}" y="${PT}" width="${slot}" height="${IH}" ${tipAttr(tip)}></rect>`;
      const hD = IH - (y2(r.feedsD) - PT), hN = IH - (y2(r.feedsN) - PT);
      c2 += col(i, y2(0), hD, 'var(--c-toma)', tip);
      if (hN > 0) c2 += col(i, y2(0) - hD - 2, hN, 'var(--c-sueno)', tip);
      const tot = r.feedsD + r.feedsN;
      if (slot >= 20 && tot) c2 += `<text x="${x(i) + bw / 2}" y="${y2(tot) - 4}" text-anchor="middle" style="font-size:${slot >= 30 ? 9.5 : 8.5}px;fill:var(--muted)">${Math.round(r.feedsN / tot * 100)}%</text>`; });
    const totD = withDataAll.reduce((a, r) => a + r.feedsD, 0), totN = withDataAll.reduce((a, r) => a + r.feedsN, 0);
    const share2 = totD + totN ? L.hShare(Math.round(totD / (totD + totN) * 100), Math.round(totN / (totD + totN) * 100)) : '';

    // 3. Sueño noche / siestas (apiladas, horas)
    const smax = Math.max(12, ...rows.map(r => (r.naps + r.nightSleep) / H));
    const sm = Math.ceil(smax / 4) * 4;
    const y3 = v => PT + IH - v / sm * IH;
    let c3 = yTicks(sm, 4, '');
    rows.forEach((r, i) => { if (!r.has) return; const tot = (r.naps + r.nightSleep) / H; const pN = (r.naps + r.nightSleep) ? Math.round(r.nightSleep / (r.naps + r.nightSleep) * 100) : 0; const tip = `<b>${fmtHours(r.naps + r.nightSleep)} ${L.h}</b><br>${dayName(r.id)}<br>${L.sNightSleep}: ${fmtHours(r.nightSleep)} ${L.h} (${pN} %) · ${L.sNaps}: ${fmtHours(r.naps)} ${L.h} (${100 - pN} %)`;
      c3 += `<rect class="hit" x="${PL + slot * i}" y="${PT}" width="${slot}" height="${IH}" ${tipAttr(tip)}></rect>`;
      const hN = IH - (y3(r.nightSleep / H) - PT), hS = IH - (y3(r.naps / H) - PT);
      c3 += col(i, y3(0), hN, 'var(--c-sueno)', tip);
      if (hS > 0) c3 += col(i, y3(0) - hN - 2, hS, 'var(--c-sueno-2)', tip);
      if (slot >= 20 && tot) c3 += `<text x="${x(i) + bw / 2}" y="${y3(tot) - 4}" text-anchor="middle" style="font-size:${slot >= 30 ? 9.5 : 8.5}px;fill:var(--muted)">${Math.round(r.nightSleep / (r.nightSleep + r.naps) * 100)}%</text>`; });
    const sumN = withDataAll.reduce((a, r) => a + r.nightSleep, 0), sumS = withDataAll.reduce((a, r) => a + r.naps, 0);
    const share3 = sumN + sumS ? L.hShareSleep(Math.round(sumN / (sumN + sumS) * 100), Math.round(sumS / (sumN + sumS) * 100)) : '';

    // 4. Hora de acostarse y de despertar (eje: 18:00 → 12:00 del día siguiente)
    const tmin = 18 * 60, tmax = 36 * 60;
    const y4 = m => PT + IH - (m - tmin) / (tmax - tmin) * IH;
    let c4 = '';
    for (let hh = 18; hh <= 36; hh += 6) { const y = y4(hh * 60); c4 += `<line class="grid" x1="${PL}" x2="${W - PR}" y1="${y}" y2="${y}"></line><text x="${PL - 5}" y="${y + 3.5}" text-anchor="end">${pad(hh % 24)}</text>`; }
    const pts = (key, adjust) => rows.map((r, i) => r[key] != null ? { i, m: adjust(r[key]), r } : null).filter(Boolean);
    const bedPts = pts('bed', m => m < 12 * 60 ? m + 24 * 60 : m), wakePts = pts('wake', m => m + 24 * 60);
    const path = ps => ps.length > 1 ? `<path d="${ps.map((p, k) => `${k ? 'L' : 'M'}${x(p.i) + bw / 2} ${y4(p.m)}`).join(' ')}" fill="none" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"` : '';
    if (bedPts.length > 1) c4 += path(bedPts) + ` stroke="var(--c-sueno)"></path>`;
    if (wakePts.length > 1) c4 += path(wakePts) + ` stroke="var(--c-toma)"></path>`;
    const dot = (p, fill, label) => `<circle cx="${x(p.i) + bw / 2}" cy="${y4(p.m)}" r="6" fill="var(--surface)"></circle><circle class="mark" cx="${x(p.i) + bw / 2}" cy="${y4(p.m)}" r="4" fill="${fill}" ${tipAttr(`<b>${fmtMinutes(p.m % (24 * 60))}</b><br>${label} · ${dayName(p.r.id)}`)}></circle><circle class="hit" cx="${x(p.i) + bw / 2}" cy="${y4(p.m)}" r="12" ${tipAttr(`<b>${fmtMinutes(p.m % (24 * 60))}</b><br>${label} · ${dayName(p.r.id)}`)}></circle>`;
    bedPts.forEach(p => c4 += dot(p, 'var(--c-sueno)', L.sBed));
    wakePts.forEach(p => c4 += dot(p, 'var(--c-toma)', L.sWake));

    // 5. Mapa de calor: tomas por hora + lectura
    const heat = new Array(24).fill(0);
    withData.forEach(r => r.hours.forEach(h => heat[h]++));
    const hmax = Math.max(1, ...heat), hTotal = heat.reduce((a, b) => a + b, 0);
    const heatCells = `<div class="heat">${heat.map((v, h) => `<div style="background:${v ? `color-mix(in oklab, var(--c-toma) ${Math.round(25 + 75 * v / hmax)}%, var(--surface-2))` : 'var(--surface-2)'}" ${tipAttr(`<b>${v} ${L.tipFeeds}</b><br>${pad(h)}:00–${pad((h + 1) % 24)}:00`)}></div>`).join('')}</div>
      <div class="tl-hours" style="margin-top:4px">${[0, 6, 12, 18, 24].map(h => `<span class="${h === 0 ? 'first' : h === 24 ? 'last' : ''}" style="left:${h / 24 * 100}%">${h === 24 ? '24 ' + L.h : pad(h)}</span>`).join('')}</div>`;
    let heatRead = '';
    if (hTotal >= 8) {
      // ventana de 3 h con más tomas
      let best = -1, bi = 0;
      for (let h = 0; h < 24; h++) { const v = heat[h] + heat[(h + 1) % 24] + heat[(h + 2) % 24]; if (v > best) { best = v; bi = h; } }
      const nightN = heat.reduce((a, v, h) => a + ((h >= 20 || h < 7) ? v : 0), 0);
      const nightPct = Math.round(nightN / hTotal * 100);
      // hueco más largo sin ninguna toma
      let gapLen = 0, gapStart = null, curLen = 0, curStart = 0;
      for (let k = 0; k < 48; k++) { const h = k % 24;
        if (!heat[h]) { if (curLen === 0) curStart = h; curLen++; if (curLen > gapLen && curLen <= 24) { gapLen = curLen; gapStart = curStart; } }
        else curLen = 0; }

  // ---------- Registro por voz ----------
  // Reglas locales (sin Claude): reconoce toma / dormir / despertar / pañal en una frase
  function parseLogRules(text) {
    const t = text.toLowerCase(), ev = [];
    const agoM = /hace\s+(\d+)\s*min|il y a\s+(\d+)\s*min/.exec(t); const agoH = /hace\s+(?:una|1)\s*hora|il y a\s+(?:une|1)\s*heure|hace media hora|il y a une demi-heure/.exec(t);
    const base = agoM ? Number(agoM[1] || agoM[2]) : agoH ? (/media|demi/.test(agoH[0]) ? 30 : 60) : 0;
    const hasFeed = /toma|tetée|tétée|pecho|sein|mam[óo]|tété/.test(t);
    const hasSleep = /dormid|duerme|dormir|endormi|dort/.test(t) && !/despert|réveil/.test(t) || /se acaba de dormir|vient de s.endormir/.test(t);
    const hasWake = /despert|réveill/.test(t);
    const hasDiaper = /pañal|panal|couche|pip[ií]|caca/.test(t);
    const lado = /izq|gauche/.test(t) ? 'I' : /der|droit/.test(t) ? 'D' : /ambos|los dos|deux/.test(t) ? 'A' : '';
    const dur = /larga|longue/.test(t) ? 'larga' : /corta|courte/.test(t) ? 'corta' : '';
    const panal = /caca/.test(t) ? (/pip/.test(t) ? 'ambos' : 'caca') : 'pipi';
    // orden aproximado: pañal y toma antes del sueño
    if (hasDiaper) ev.push({ tipo: 'panal', hace_min: base + (hasSleep ? 8 : 0), lado: '', duracion: '', panal, texto: '' });
    if (hasFeed) ev.push({ tipo: 'toma', hace_min: base + (hasSleep ? 5 : 0), lado, duracion: dur, panal: '', texto: '' });
    if (hasWake) ev.push({ tipo: 'despertar', hace_min: base, lado: '', duracion: '', panal: '', texto: '' });
    if (hasSleep) ev.push({ tipo: 'sueno', hace_min: base, lado: '', duracion: '', panal: '', texto: '' });
    return ev;
  }
  function describeProposed(e) {
    const when = L.vAgo(e.hace_min);
    if (e.tipo === 'toma') return `${L.evFeed}${e.lado ? ' · ' + L.side[e.lado] : ''}${e.duracion ? ' · ' + (e.duracion === 'larga' ? L.durLong : L.durShort) : ''} · ${when}`;
    if (e.tipo === 'sueno') return `${L.evSleepStart} · ${when}`;
    if (e.tipo === 'despertar') return `${L.evWake} · ${when}`;
    if (e.tipo === 'panal') return `${L.evDiaper} · ${e.panal === 'caca' ? L.pooOnly : e.panal === 'ambos' ? L.both : L.peeOnly} · ${when}`;
    return `${L.evNote} · ${e.texto}`;
  }
  function applyProposed(list) {
    const now = Date.now(); let n = 0;
    for (const e of list) {
      const at = now - (e.hace_min || 0) * MIN;
      if (e.tipo === 'toma') { const mins = e.duracion === 'larga' ? DUR_LONG : DUR_SHORT; upsertEvent({ id: uid(), t: 'toma', ini: at - mins * MIN, fin: at, lado: e.lado || 'A', dur: e.duracion || 'corta', aprox: true }); n++; }
      else if (e.tipo === 'sueno') { const open = activeOf('sueno'); if (!open) { upsertEvent({ id: uid(), t: 'sueno', ini: at, fin: null }); n++; } }
      else if (e.tipo === 'despertar') { const open = activeOf('sueno'); if (open && at > open.ini) { upsertEvent({ ...open, fin: at }); n++; } }
      else if (e.tipo === 'panal') { upsertEvent({ id: uid(), t: 'panal', ini: at, fin: null, p: e.panal || 'pipi' }); n++; }
      else if (e.tipo === 'nota' && e.texto) { upsertEvent({ id: uid(), t: 'nota', ini: at, fin: null, n: e.texto }); n++; }
    }
    return n;
  }

  }

  // ---------- InstAïna ----------
  let momentos = [];           // [{ id, ts, nota }], más reciente primero
  const imgCache = new Map();  // id -> object URL (las imágenes van con la cabecera de autorización)
  function imgUrl(id) {
    if (imgCache.has(id)) return imgCache.get(id);
    imgCache.set(id, '');
    apiFetch('/api/momentos/' + id + '/img').then(r => r.ok ? r.blob() : null).then(b => { if (!b) return; imgCache.set(id, URL.createObjectURL(b)); document.querySelectorAll(`img[data-id="${id}"], button[data-id="${id}"] img`).forEach(el => { el.src = imgCache.get(id); }); }).catch(() => {});

  async function pullMomentos() {

  // Redimensiona en el móvil a 1280 px de lado mayor y JPEG al 82 %: ~150–300 KB
  function shrinkImage(file) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file), im = new Image();
      im.onload = () => {
        const max = 1280, k = Math.min(1, max / Math.max(im.width, im.height));
        const cv = document.createElement('canvas'); cv.width = Math.round(im.width * k); cv.height = Math.round(im.height * k);
        cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height);
        URL.revokeObjectURL(url);
        resolve(cv.toDataURL('image/jpeg', 0.82));
      };
      im.onerror = () => { URL.revokeObjectURL(url); reject(new Error('decode')); }; im.src = url;
    });
  }
  // El selector de archivos vive en la página (en iOS Safari, uno creado al vuelo se pierde antes de avisar)

  // ---------- Consejo: «¿Qué está haciendo?» ----------

  // Dictado por voz con el reconocimiento del navegador (Chrome, Safari iOS 14.5+; requiere HTTPS)
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
  let rec = null;
  // Dictado: escribe en el campo indicado y mantiene la escucha aunque el
  // navegador la corte en cada pausa (iOS lo hace siempre).
  const IS_IOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  let dict = null; // { id, base, want, onState }
  function setDictStatus(msg) { if (dict && dict.onState) dict.onState(msg); }
  function startDictation(textareaId, onState) {
    if (!SR) { toast(L.qMicFail); return false; }
    if (rec) { stopDictation(); return false; }
    const ta = document.getElementById(textareaId);
    if (!ta) return false;
    dict = { id: textareaId, base: ta.value.trim(), want: true, onState, heard: false, strikes: 0, t0: 0 };
    const run = () => {
      rec = new SR();
      rec.lang = lang === 'fr' ? 'fr-FR' : 'es-ES';
      rec.interimResults = true;
      rec.continuous = !IS_IOS;        // en iOS la escucha continua no funciona: se reinicia sola
      rec.onresult = ev => {
        let fin = '', interim = '';
        for (let i = ev.resultIndex; i < ev.results.length; i++) {
          const r = ev.results[i];
          if (r.isFinal) fin += r[0].transcript + ' '; else interim += r[0].transcript;
        }
        if (fin) { dict.base = (dict.base + ' ' + fin).trim(); dict.heard = true; }
        const t = document.getElementById(dict.id);
        if (t) t.value = (dict.base + ' ' + interim).trim();
        if (fin || interim) setDictStatus(L.micListening);
      };
      rec.onerror = e => {
        if (e.error === 'not-allowed' || e.error === 'service-not-allowed') { dict.want = false; setDictStatus(L.micDenied); }
        else if (e.error === 'network') { dict.want = false; setDictStatus(L.micNet); }
        // 'no-speech' y 'aborted' no son errores reales: se reintenta en onend
      };
      rec.onend = () => {
        rec = null;
        if (dict && dict.want) {
          // Si el navegador corta enseguida y sin oír nada varias veces, no insistimos
          dict.strikes = (Date.now() - dict.t0 < 400) ? dict.strikes + 1 : 0;
          if (dict.strikes < 3) { try { run(); return; } catch {} }
        }
        const fin = dict; dict = null;
        if (fin && fin.onState) fin.onState(fin.heard ? '' : L.micNone);
      };
      dict.t0 = Date.now();
      rec.start();
    };
    try { run(); setDictStatus(L.micListening); return true; }
    catch { rec = null; dict = null; toast(L.qMicFail); return false; }
  }
  function stopDictation() {
    if (dict) dict.want = false;
    if (rec) { try { rec.stop(); } catch { rec = null; } }
  }

  // Contexto compacto de ahora mismo, para las reglas y para Claude
  function nowContext() {
    const now = Date.now(), evs = allEvents(), today = dayOf(now);
    const sleeping = activeOf('sueno'), feeding = activeOf('toma');
    const lastSleep = [...evs].reverse().find(e => e.t === 'sueno' && e.fin != null);
    const lastFeed = [...evs].reverse().find(e => e.t === 'toma' && e.fin != null);
    const wake = morningWake(evs.filter(e => e.t === 'sueno'), dayStart(today));
    const naps = evs.filter(e => e.t === 'sueno' && e.ini >= (wake ?? dayStart(today) + 7 * H) && e.fin != null);
    const night = nightStats(evs, shiftDay(today, -1));
    return {
      now, sleeping: !!sleeping, feeding: !!feeding,
      awakeMin: !sleeping && lastSleep ? (now - lastSleep.fin) / MIN : null,
      lastNapMin: lastSleep ? (lastSleep.fin - lastSleep.ini) / MIN : null,
      sinceFeedMin: lastFeed ? (now - lastFeed.fin) / MIN : null,
      napsToday: naps.length,
      nightFeeds: night ? night.feeds : null,
      hour: new Date(now).getHours() + new Date(now).getMinutes() / 60,
    };
  }
  function contextText(c) {
    const fr = lang === 'fr';
    const lines = [];
    lines.push(`${fr ? 'Heure' : 'Hora'}: ${fmtTime(c.now)}${isNight(c.now) ? (fr ? ' (nuit : pas de fenêtre d’éveil, tétée et retour au dodo)' : ' (noche: no hay ventana de vigilia, toma y vuelta a dormir)') : ''}`);
    if (c.sleeping) lines.push(fr ? 'Elle dort en ce moment.' : 'Está durmiendo ahora mismo.');
    else if (c.awakeMin != null) lines.push(`${fr ? 'Éveillée depuis' : 'Despierta desde hace'} ${fmtDur(c.awakeMin * MIN)}`);
    if (c.lastNapMin != null) lines.push(`${fr ? 'Dernier sommeil' : 'Último sueño'}: ${fmtDur(c.lastNapMin * MIN)}`);
    if (c.sinceFeedMin != null) lines.push(`${fr ? 'Dernière tétée il y a' : 'Última toma hace'} ${fmtDur(c.sinceFeedMin * MIN)}`);
    lines.push(`${fr ? 'Siestes aujourd’hui' : 'Siestas hoy'}: ${c.napsToday}`);
    if (c.nightFeeds != null) lines.push(`${fr ? 'Tétées la nuit dernière' : 'Tomas anoche'}: ${c.nightFeeds}`);
    return lines.join('\n');
  }

  // Motor de reglas: funciona sin conexión y sin clave de Claude
  function ruleAdvice(text, c, lg = lang) {
    const t = text.toLowerCase();
    const has = re => re.test(t);
    const sleepy = has(/frota|toca la cara|tocarse la cara|se toca|bostez|mirada perdida|ojos|orejas|gru[ñn]|grit|lloriqu|queja|inquiet|arque|nerviosa|cansad|se frotte|bâill|regard|oreilles|grogn|crie|gémit|agit|fatigu/);
    const hungry = has(/busca|chupa|mano en la boca|manos a la boca|abre la boca|lengua|hambre|pecho|teta|cherche|main.*bouche|succ|faim|sein|tète/);
    const crying = has(/llora|llanto|pleure|pleurs|hurle/);
    const content = has(/sonr|juega|jugando|tranquil|content|mira|balbuc|ríe|rie|sourit|joue|calme|regarde|babille|rit/);
    const fr = lg === 'fr';
    const awake = c.awakeMin ?? 0, feedAgo = c.sinceFeedMin ?? 999;
    const napAt = c.awakeMin != null ? fmtTime(c.now + Math.max(0, 75 - awake) * MIN) : null;
    const P = (es, f) => fr ? f : es;
    if (isNight(c.now) && !c.sleeping) return P(`Es de noche: no cuenta como ventana de vigilia. ${hungry || feedAgo > 90 ? 'Toma' : 'Si busca, toma'} con luz mínima, sin hablar ni jugar${crying ? ', y si llora al soltar el pecho, brazos pegada a ti con shhh, sin encender luces' : ''}. Pañal solo si hay caca o está empapado, y antes de la toma. En cuanto se relaje, a la cuna aunque no esté dormida del todo.`, `C’est la nuit : ça ne compte pas comme fenêtre d’éveil. ${hungry || feedAgo > 90 ? 'Tétée' : 'Si elle cherche, tétée'} avec un minimum de lumière, sans parler ni jouer${crying ? ', et si elle pleure en lâchant le sein, dans les bras contre toi avec chhh, sans allumer' : ''}. Couche seulement s’il y a du caca ou si elle est trempée, et avant la tétée. Dès qu’elle se détend, au lit même pas tout à fait endormie.`);
    if (c.sleeping) return P('Está durmiendo: déjala. Si se despierta antes de 40 min, prueba a volver a dormirla en el sitio (mano en el pecho, shhh) antes de sacarla. Cuando se despierte de verdad: toma primero, luego actividad.', 'Elle dort : laisse-la. Si elle se réveille avant 40 min, essaie de la rendormir sur place (main sur la poitrine, chhh) avant de la lever. Au vrai réveil : tétée d’abord, puis activité.');
    if (awake > 120) return P(`Lleva ${fmtDur(awake * MIN)} despierta: está pasada de vueltas y por eso cuesta más. Baja luz y ruido ya, sin juego. ${feedAgo > 90 ? 'Ofrécele pecho en un sitio tranquilo y ' : ''}duérmela en brazos o portabebés con balanceo y sonido shhh. Si llora fuerte, no es hambre de estímulos: es sueño.`, `Éveillée depuis ${fmtDur(awake * MIN)} : elle est surstimulée, d’où la difficulté. Baisse lumière et bruit tout de suite, plus de jeu. ${feedAgo > 90 ? 'Propose le sein au calme et ' : ''}endors-la dans les bras ou en porte-bébé, balancement et chhh. Si elle pleure fort, ce n’est pas un besoin de stimulation : c’est du sommeil.`);
    if (sleepy && awake >= 40) return P(`Señales de sueño con ${fmtDur(awake * MIN)} despierta: es el momento, no esperes a la ventana teórica. Sácala del juego, baja luz y ruido${feedAgo > 90 ? `, ofrécele pecho (lleva ${fmtDur(feedAgo * MIN)} sin tomar) y probablemente se duerma en él` : ''}. Si en 10–15 min no cae, en brazos o portabebés con balanceo suave.`, `Signes de fatigue après ${fmtDur(awake * MIN)} d’éveil : c’est le moment, n’attends pas la fenêtre théorique. Sors-la du jeu, baisse lumière et bruit${feedAgo > 90 ? `, propose le sein (dernière tétée il y a ${fmtDur(feedAgo * MIN)}) et elle s’endormira probablement dessus` : ''}. Si elle ne s’endort pas en 10–15 min, dans les bras ou en porte-bébé, balancement doux.`);
    if (hungry || feedAgo > 150) return P(`Parece hambre${feedAgo < 999 ? ` (última toma hace ${fmtDur(feedAgo * MIN)})` : ''}: ofrécele pecho ahora, tranquila y sin prisa, los dos pechos si los acepta. ${awake >= 60 ? `Después, con ${fmtDur(awake * MIN)} despierta, lo siguiente será dormirla${napAt ? ` hacia las ${napAt}` : ''}.` : 'Después, un rato de actividad tranquila.'}`, `Ça ressemble à de la faim${feedAgo < 999 ? ` (dernière tétée il y a ${fmtDur(feedAgo * MIN)})` : ''} : propose le sein maintenant, au calme, les deux seins si elle accepte. ${awake >= 60 ? `Ensuite, après ${fmtDur(awake * MIN)} d’éveil, il faudra l’endormir${napAt ? ` vers ${napAt}` : ''}.` : 'Ensuite, un moment d’activité calme.'}`);
    if (crying) return P(`Llora con ${fmtDur(awake * MIN)} despierta y ${feedAgo < 999 ? fmtDur(feedAgo * MIN) + ' desde la toma' : 'sin toma registrada'}. Repasa en este orden: pañal, ${feedAgo > 60 ? 'pecho, ' : ''}calor o frío, gases (a upa, espalda). Si nada lo calma y lleva más de 1 h despierta, es sueño: a oscuras, en brazos, shhh.`, `Elle pleure après ${fmtDur(awake * MIN)} d’éveil et ${feedAgo < 999 ? fmtDur(feedAgo * MIN) + ' depuis la tétée' : 'sans tétée enregistrée'}. Vérifie dans l’ordre : couche, ${feedAgo > 60 ? 'sein, ' : ''}chaud ou froid, gaz (contre l’épaule, dos). Si rien ne calme et qu’elle est éveillée depuis plus d’1 h, c’est du sommeil : dans le noir, dans les bras, chhh.`);
    if (sleepy) return P(`Primeras señales de sueño pero solo lleva ${fmtDur(awake * MIN)} despierta: probablemente la siesta anterior (${c.lastNapMin != null ? fmtDur(c.lastNapMin * MIN) : '—'}) se le quedó corta. Baja el ritmo ya: luz suave, en brazos, y a dormir en cuanto bostece otra vez.`, `Premiers signes de fatigue mais seulement ${fmtDur(awake * MIN)} d’éveil : la sieste précédente (${c.lastNapMin != null ? fmtDur(c.lastNapMin * MIN) : '—'}) était sans doute trop courte. Ralentis dès maintenant : lumière douce, dans les bras, et dodo au prochain bâillement.`);
    if (content && awake < 75) return P(`Está a gusto: aprovecha para actividad tranquila (suelo, mirarse, hablarle)${feedAgo > 90 ? ', y ofrécele pecho antes de que pida' : ''}. Empieza a calmarla${napAt ? ` sobre las ${napAt}` : ' dentro de 15–30 min'} o antes si bosteza o se frota la cara.`, `Elle est bien : profite pour une activité calme (au sol, se regarder, lui parler)${feedAgo > 90 ? ', et propose le sein avant qu’elle ne réclame' : ''}. Commence à la calmer${napAt ? ` vers ${napAt}` : ' dans 15–30 min'} ou avant si elle bâille ou se frotte le visage.`);
    if (awake >= 75) return P(`Lleva ${fmtDur(awake * MIN)} despierta: aunque parezca contenta, está en la zona de dormirla. Baja luz y estímulos${feedAgo > 90 ? ', ofrécele pecho' : ''} y empieza el ritual de siesta ahora; si esperas a que se queje, costará más.`, `Éveillée depuis ${fmtDur(awake * MIN)} : même si elle semble contente, on est dans la zone du coucher. Baisse lumière et stimulations${feedAgo > 90 ? ', propose le sein' : ''} et lance le rituel de sieste maintenant ; si tu attends qu’elle se plaigne, ce sera plus dur.`);
    return P(`Con ${fmtDur(awake * MIN)} despierta y ${feedAgo < 999 ? 'la última toma hace ' + fmtDur(feedAgo * MIN) : 'sin toma registrada'}: sigue con actividad tranquila${feedAgo > 90 ? ', ofrécele pecho' : ''} y vigila señales de sueño (bostezo, frotarse la cara, mirada perdida)${napAt ? `; la ventana buena para dormirla empieza hacia las ${napAt}` : ''}.`, `Après ${fmtDur(awake * MIN)} d’éveil et ${feedAgo < 999 ? 'une tétée il y a ' + fmtDur(feedAgo * MIN) : 'sans tétée enregistrée'} : continue une activité calme${feedAgo > 90 ? ', propose le sein' : ''} et guette les signes de fatigue (bâillement, se frotter le visage, regard dans le vide)${napAt ? ` ; la bonne fenêtre pour l’endormir commence vers ${napAt}` : ''}.`);
  }

  async function askAdvice() {
    const ta = document.getElementById('q-text');
    ask.text = ta ? ta.value.trim() : ask.text;
    if (!ask.text) { toast(L.qNeedText); return; }
    if (ask.state === 'loading') return;
    if (ask.day !== dayOf(Date.now())) { ask.turns = []; ask.day = dayOf(Date.now()); }
    const c = nowContext();
    const q = ask.text;
    ask.turns.push({ role: 'user', texto: q, time: fmtTime(Date.now()) });
    ask.text = ''; ask.state = 'loading'; saveChat(); render();
    let answer = '', source = 'reglas', trad = '';
    if (api) {
      try {
        const r = await apiFetch('/api/consejo', { method: 'POST', body: JSON.stringify({ lang, contexto: contextText(c), mensajes: ask.turns.map(m => ({ role: m.role, texto: m.texto })) }) });
        if (r.ok) { const d = await r.json(); if (d.fuente === 'claude' && d.texto) { answer = d.texto; source = 'claude'; trad = d.traduccion || ''; } }
      } catch {}
    }
    if (!answer) { answer = ruleAdvice(q, c); trad = ruleAdvice(q, c, lang === 'fr' ? 'es' : 'fr'); }
    ask.turns.push({ role: 'assistant', texto: answer, trad, lang, source, time: fmtTime(Date.now()) });
    ask.state = 'done'; saveChat();
    render();
  }
